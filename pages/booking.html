<diV class="forms_1">
          <form  class="simple-form">
  <h2>Book an Appointment</h2>

  
  <div class="form-group">
    <label for="client-name">Your Name</label>
    <input type="text" id="client-name" name="name" required placeholder="John Doe">
  </div>

  <div class="form-group">
    <label for="client-email">Email Address</label>
    <input type="email" id="client-email" name="email" required placeholder="john@example.com">
  </div>


  <div class="form-group">
    <label for="appt-date">Choose Date</label>
    <input type="date" id="appt-date" name="date" required min="2026-07-03">
  </div>


  <div class="form-group">
    <label for="appt-time">Choose Time</label>
    <input type="time" id="appt-time" name="time" required min="09:00" max="17:00">
  </div>


  <button type="submit" class="submit-button">Confirm Booking</button>
</form>
